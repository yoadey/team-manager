{{- if .Values.push.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "team-manager.fullname" . }}-push
  labels:
    {{- include "team-manager.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.push.secret.existingSecretKey }}: {{ .Values.push.secret.privateKey | b64enc }}
{{- end }}

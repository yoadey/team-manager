{{- if .Values.jwt.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "team-manager.fullname" . }}-jwt
  labels:
    {{- include "team-manager.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.jwt.secret.existingSecretKeys.privateKey }}: {{ .Values.jwt.secret.privateKey | b64enc }}
  {{ .Values.jwt.secret.existingSecretKeys.publicKey }}: {{ .Values.jwt.secret.publicKey | b64enc }}
{{- end }}

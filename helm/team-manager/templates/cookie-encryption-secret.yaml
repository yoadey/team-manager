{{- if .Values.cookieEncryption.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "team-manager.fullname" . }}-cookie-encryption
  labels:
    {{- include "team-manager.labels" . | nindent 4 }}
type: Opaque
data:
  COOKIE_ENCRYPTION_KEY: {{ .Values.cookieEncryption.secret.key | b64enc }}
  COOKIE_ENCRYPTION_KEYS: {{ .Values.cookieEncryption.secret.keys | b64enc }}
{{- end }}

# Production overrides — HA, autoscaling, strict resource limits.
replicaCount: 3

# The backend API's own ingress -- see the frontend section below for the
# user-facing team-manager.example.com host.
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  hosts:
    - host: api.team-manager.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: team-manager-prod-api-tls
      hosts:
        - api.team-manager.example.com

server:
  allowedOrigins:
    - "https://team-manager.example.com"
  # Since ingress is enabled above, every request is proxied through
  # nginx-ingress — set this to your cluster's ingress-controller pod CIDR
  # (or LB egress range) or rate limiting/login brute-force protection
  # silently keys on the ingress controller's own IP for every client. See
  # docs/operations.md's "Rate limiting" section. `helm install`/`upgrade`
  # prints a warning (see templates/NOTES.txt) if this is left unset.
  # trustedProxyCidrs:
  #   - "10.244.0.0/16"

session:
  cookie:
    secure: true

observability:
  otelServiceName: "team-manager-backend"
  environment: "production"
  sentry:
    secret:
      existingSecret: "team-manager-prod-sentry"

# Every credential below is its own Secret -- no combined "God Secret" -- so
# rotating one area (e.g. S3 access key) never touches another area's
# (e.g. JWT signing key) blast radius. Create each Secret out-of-band
# (external-secrets + Vault/AWS SM, or manually) with the default key names
# documented per section in values.yaml -- or, if your secret store's own
# naming convention differs (e.g. an External Secrets Operator sync), set
# the matching <area>.secret.existingSecretKey[s] override instead of
# re-keying the Secret. s3.endpoint/s3.bucket and
# smtp.host/smtp.fromAddress still need a values override too (see
# docs/operations.md's "Object storage (image uploads)" and "Outbound email
# (SMTP)" sections) — templates/NOTES.txt warns at deploy time if either is
# missing.
database:
  secret:
    existingSecret: "team-manager-prod-database"

jwt:
  secret:
    existingSecret: "team-manager-prod-jwt"

cookieEncryption:
  secret:
    existingSecret: "team-manager-prod-cookie-encryption"

s3:
  secret:
    existingSecret: "team-manager-prod-s3"

smtp:
  host: "s221.goserver.host"
  fromAddress: "info@yoadey.de"
  secret:
    existingSecret: "team-manager-prod-smtp"

push:
  secret:
    existingSecret: "team-manager-prod-push"

pagination:
  secret:
    existingSecret: "team-manager-prod-pagination"

metrics:
  secret:
    existingSecret: "team-manager-prod-metrics"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

backup:
  enabled: true
  s3:
    enabled: true
    bucket: "team-manager-prod-backups"
    # Uses the pod's IAM role by default (see serviceAccount.annotations for
    # IRSA); set backup.s3.credentialsSecretName to use static credentials
    # instead.

frontend:
  enabled: true
  replicaCount: 3
  # See the backend image.tag note in values-staging.yaml -- always set
  # frontend.image.tag explicitly for a real deploy.
  apiBaseUrl: "https://api.team-manager.example.com"
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: team-manager.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: team-manager-prod-frontend-tls
        hosts:
          - team-manager.example.com
  # frontend.operator.* deliberately left unset here -- a club's real
  # legal-notice contact details (name, business address, phone, email)
  # aren't committed to this public repository's example overlay. Set them
  # via --set/an untracked overlay at actual deploy time; see
  # docs/operations.md's "Legal setup before going public".
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 64Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

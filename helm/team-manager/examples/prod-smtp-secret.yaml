# Example Secret for values-prod.yaml's smtp.secret.existingSecret
# ("team-manager-prod-smtp"). Per docs/operations.md's "Outbound email
# (SMTP)" section, this chart never renders this Secret itself in
# production — create it out-of-band (external-secrets + Vault/AWS SM, or
# `kubectl apply -f` this file after replacing the demo credentials below)
# in the same namespace as the Helm release.
#
# `data` values are base64-encoded (kubectl/Kubernetes' standard Secret
# encoding, not real encryption) placeholders --
# SMTP_USERNAME=demo-smtp-user, SMTP_PASSWORD=demo-smtp-password. Replace
# both with the real credentials for s221.goserver.host (see
# values-prod.yaml's smtp.host) before applying to a real cluster.
apiVersion: v1
kind: Secret
metadata:
  name: team-manager-prod-smtp
type: Opaque
data:
  SMTP_USERNAME: ZGVtby1zbXRwLXVzZXI=
  SMTP_PASSWORD: ZGVtby1zbXRwLXBhc3N3b3Jk

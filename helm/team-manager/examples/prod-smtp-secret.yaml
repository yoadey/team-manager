# Example Secret for values-prod.yaml's smtp.secret.existingSecret
# ("team-manager-prod-smtp"). This chart never renders this Secret itself
# (see docs/operations.md's "Outbound email (SMTP)" section) -- create it
# out-of-band (external-secrets + Vault/AWS SM, or `kubectl apply -f` this
# file after replacing the demo credentials below) in the same namespace
# as the Helm release.
#
# Keyed per smtp.secret.keys' defaults (username/password) -- override
# those values.yaml fields instead if your Secret uses different key
# names.
#
# `data` values are base64-encoded (kubectl/Kubernetes' standard Secret
# encoding, not real encryption) placeholders --
# username=demo-smtp-user, password=demo-smtp-password. Replace
# both with the real credentials for s221.goserver.host (see
# values-prod.yaml's smtp.host) before applying to a real cluster.
apiVersion: v1
kind: Secret
metadata:
  name: team-manager-prod-smtp
type: Opaque
data:
  username: ZGVtby1zbXRwLXVzZXI=
  password: ZGVtby1zbXRwLXBhc3N3b3Jk

# Staging overrides — lower resource footprint, debug logging enabled.
replicaCount: 1

# No image.tag override here (deliberately): it used to hardcode "main", but
# .github/workflows/release.yml only ever builds and pushes images on a
# vX.Y.Z tag push (see its metadata-action tag list) or "latest" for tagged
# releases — it never publishes a "main"-tagged image, so that reference
# resolved to a nonexistent tag and staging deploys would ImagePullBackOff.
# Staging falls back to the same default as production (image.tag empty ->
# Chart.appVersion) — but nothing in the release process bumps
# Chart.yaml's appVersion to match the latest released tag (it's been
# hand-set to "0.1.0" since the chart's initial commit), so that fallback is
# NOT "the most recently released version" despite what an earlier version
# of this comment claimed — it's a fixed placeholder. templates/NOTES.txt
# warns about this at deploy time. ALWAYS set image.tag explicitly (e.g.
# --set image.tag=1.2.3, stripped of the v prefix, matching a real release
# tag) for any real staging/production deploy. If you want staging to
# continuously track unreleased main-branch commits instead, add your own
# image-publishing pipeline for that — this chart doesn't ship one.
# The backend API's own ingress -- see the frontend section below for the
# user-facing staging.team-manager.example.com host.
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # Match prod's ingress body-size limit: the backend accepts multipart
    # uploads (team/profile photos) up to 2 MB, but nginx-ingress defaults to
    # a 1m client-max-body-size when this annotation is absent, so staging
    # would 413 uploads between 1-2 MB that prod (and the app itself) accept.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  hosts:
    - host: api-staging.team-manager.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: team-manager-staging-api-tls
      hosts:
        - api-staging.team-manager.example.com

server:
  allowedOrigins:
    - "https://staging.team-manager.example.com"
  # See the same note in values-prod.yaml: ingress is enabled above, so set
  # this to your cluster's ingress-controller pod CIDR or rate limiting
  # silently keys on the ingress controller's own IP for every client.
  # trustedProxyCidrs:
  #   - "10.244.0.0/16"
  logLevel: "debug"

session:
  cookie:
    secure: true

observability:
  otelServiceName: "team-manager-backend-staging"
  environment: "staging"
  sentry:
    secret:
      existingSecret: "team-manager-staging-sentry"

# One Secret per credential area -- see the same note in values-prod.yaml.
# Each area also has an existingSecretKey[s] override (see values.yaml) if
# these Secrets are ever populated by tooling that doesn't use this chart's
# default key names -- not needed here since they're created to match those
# defaults.
database:
  secret:
    existingSecret: "team-manager-staging-database"

jwt:
  secret:
    existingSecret: "team-manager-staging-jwt"

cookieEncryption:
  secret:
    existingSecret: "team-manager-staging-cookie-encryption"

s3:
  secret:
    existingSecret: "team-manager-staging-s3"

smtp:
  secret:
    existingSecret: "team-manager-staging-smtp"

push:
  secret:
    existingSecret: "team-manager-staging-push"

pagination:
  secret:
    existingSecret: "team-manager-staging-pagination"

metrics:
  secret:
    existingSecret: "team-manager-staging-metrics"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

frontend:
  enabled: true
  replicaCount: 1
  # See the same image.tag note above -- always set frontend.image.tag
  # explicitly for a real deploy (e.g. --set frontend.image.tag=1.2.3).
  apiBaseUrl: "https://api-staging.team-manager.example.com"
  sentryDsn: ""
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
    hosts:
      - host: staging.team-manager.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: team-manager-staging-frontend-tls
        hosts:
          - staging.team-manager.example.com
  # frontend.operator.* deliberately left unset here -- a club's real
  # legal-notice contact details (name, business address, phone, email)
  # aren't committed to this public repository's example overlay. Set them
  # via --set/an untracked overlay at actual deploy time; see
  # docs/operations.md's "Legal setup before going public".
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 32Mi
  podDisruptionBudget:
    enabled: false

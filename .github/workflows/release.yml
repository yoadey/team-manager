name: Release

# Builds and publishes versioned container images for the backend and frontend
# to the GitHub Container Registry (GHCR) on every semver tag. CI (ci.yml) gates
# correctness; this workflow produces the deployable, immutable artifacts.
on:
  push:
    tags: ['v*.*.*']
    # Publishes a `main`-tracking snapshot (image tag `main` + a sortable
    # `0.0.0-main.<run_number>` build) on every push to main, so downstream
    # test environments (e.g. fluxcd-talos-cluster's team-manager-test) can
    # auto-update via Flux image automation instead of a manual
    # workflow_dispatch + hand-edited pin for every snapshot.
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v1.2.3); defaults to the commit SHA'
        required: false
        type: string

permissions:
  contents: read

# Queue (never cancel) concurrent runs for the same ref: two parallel runs for
# the same tag could race pushing the same image tag to GHCR. Unlike ci.yml,
# this workflow must NOT set cancel-in-progress -- a release publish is a
# deliberate, rare, one-off event, not a rapid-iteration PR push, and
# cancelling one mid-push could leave a tag partially published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Build & push ${{ matrix.component }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for keyless cosign signing/attestation via GitHub's own OIDC
      # token -- no long-lived signing key/secret to manage or leak.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
            trivyignores: ''
          - component: frontend
            context: frontend
            # Mirrors ci.yml's security-container-frontend job and
            # scheduled-security-scan.yml's container-frontend job: without
            # this, CVE-2026-33630 (c-ares use-after-free in the pinned
            # nginx-unprivileged base, not yet fixed upstream as of
            # 2026-07-10 -- see the file itself) fails this scan on every
            # release cut, since ignore-unfixed alone does not filter it out.
            trivyignores: .github/trivyignore-frontend.txt
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve version
        id: version
        env:
          # Passed via env rather than interpolated directly into the script
          # below: workflow_dispatch inputs are attacker-controlled text, and
          # templating them straight into a run: block is a shell-injection
          # vector (a crafted "version" could execute arbitrary commands in a
          # job that holds packages:write and a GHCR login).
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$VERSION_INPUT" ]; then
            echo "value=$VERSION_INPUT" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # Sortable main-channel snapshot tag (plain string, no @digest --
            # some consumers of this image feed the tag straight into a
            # Kubernetes label, which rejects '@'/':' and the 63-byte limit a
            # tag+digest string can blow). A git short SHA has no reliable
            # sort order for image automation to pick "latest" by; run_number
            # is a real monotonically increasing integer, and the
            # semver-shaped `0.0.0-main.<n>` form lets Flux's ImagePolicy
            # order it correctly via genuine semver pre-release comparison
            # (see fluxcd-talos-cluster's team-manager-test/image-automation.yaml).
            type=raw,value=0.0.0-main.${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & push
        id: build
        # No platforms: key -> buildx defaults to the runner's native platform
        # only (linux/amd64 on ubuntu-latest), even though both Dockerfiles
        # pin multi-arch manifest-list base images. Every published GHCR tag
        # is amd64-only today; deploying to an arm64 node pool (e.g. AWS
        # Graviton) would fail to pull with "no matching manifest". This is a
        # deliberate scope decision, not an oversight -- multi-arch builds
        # roughly double this job's build time/GHA minutes for a platform
        # this project doesn't currently target. Add
        # `platforms: linux/amd64,linux/arm64` here if that changes.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # Build args are consumed only by the frontend Dockerfile; the backend
          # ignores unknown args, so a single block is safe for both.
          build-args: |
            VITE_BUILD_VERSION=${{ steps.version.outputs.value }}
            VITE_BUILD_COMMIT=${{ github.sha }}

      # Neither the source-tree SBOM below nor the Trivy scan already in
      # ci.yml cover the actual published image: that SBOM scans ./backend as
      # a Go module tree, and ci.yml's Trivy target is a throwaway `:ci`
      # image that's never pushed and unrelated to this digest. Without a
      # scan here, a tag cut days or weeks after the corresponding commit
      # merged to main -- a common release cadence -- could publish, sign,
      # and attest an image carrying CVEs disclosed against its base image or
      # dependencies in that window, with nothing in this workflow ever
      # having looked for them.
      - name: Scan published image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: ${{ matrix.trivyignores }}

      # Everything below signs and attests the exact digest just pushed, not
      # a tag (tags are mutable and could be repointed after the fact) --
      # `cosign verify`/`verify-attestation` against the digest is the only
      # way to answer "was this specific artifact built by this workflow and
      # not tampered with since".
      - name: Generate image SBOM (SPDX)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.component }}-image-sbom.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.component }}-image-sbom
          path: ${{ matrix.component }}-image-sbom.spdx.json
          retention-days: 90

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}"

      - name: Attest SBOM to image
        run: |
          cosign attest --yes \
            --predicate ${{ matrix.component }}-image-sbom.spdx.json \
            --type spdxjson \
            "${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}"

  helm-chart:
    name: Package & push Helm chart (OCI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for keyless cosign signing of the pushed chart digest via
      # GitHub's own OIDC token, same as the images job above.
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve chart version
        id: version
        env:
          # See the images job's "Resolve version" step for why this comes
          # from env rather than being interpolated directly into the script.
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$VERSION_INPUT" ]; then
            raw="$VERSION_INPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            raw="${GITHUB_REF_NAME}"
          else
            raw="0.0.0-sha-${GITHUB_SHA::12}"
          fi
          # helm package --version requires strict SemVer 2.0.0 with no
          # leading "v"; both the tag trigger (v*.*.*) and the
          # workflow_dispatch input use the "vX.Y.Z" convention.
          echo "value=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        # Pinned and hash-verified identically to ci.yml's helm-lint job --
        # see that job's comment for why the installer script's content hash
        # is checked instead of trusting the live v3.16.3 tag ref. Re-derive
        # this hash deliberately if bumping the version.
        env:
          GET_HELM_3_SHA256: c909b416fe831e0bf21442e068cef0312cfc7313a39cc0ad0cf1a91fdf47860d
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/v3.16.3/scripts/get-helm-3 -o get-helm-3.sh
          echo "${GET_HELM_3_SHA256}  get-helm-3.sh" | sha256sum -c -
          bash get-helm-3.sh --no-sudo --version v3.16.3
          rm -f get-helm-3.sh

      - name: helm lint
        run: helm lint --strict helm/team-manager

      - name: Package chart
        run: |
          mkdir -p /tmp/helm-package
          helm package helm/team-manager \
            --version "${{ steps.version.outputs.value }}" \
            --app-version "${{ steps.version.outputs.value }}" \
            --destination /tmp/helm-package

      - name: Log in to GHCR (Helm OCI registry)
        # `helm push` resolves credentials from Helm's own registry config
        # (~/.config/helm/registry/config.json, written by `helm registry
        # login`), not the Docker config the images job's docker/login-action
        # step writes -- that login does not carry over to this job.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username "${{ github.actor }}" --password-stdin

      - name: Push chart to OCI registry
        id: push
        run: |
          set -euo pipefail
          helm push "/tmp/helm-package/team-manager-${{ steps.version.outputs.value }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts" 2>&1 | tee /tmp/helm-push.log
          digest=$(grep -oP 'Digest: \K\S+' /tmp/helm-push.log)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (for cosign)
        # cosign resolves registry credentials from the Docker config
        # (~/.docker/config.json), not Helm's own registry config the step
        # above writes to ~/.config/helm/registry/config.json -- without
        # this, `cosign sign` below has no credentials for ghcr.io and fails
        # with "UNAUTHORIZED: unauthenticated" even though the chart push
        # itself (using Helm's separate credential store) already succeeded.
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign chart (keyless)
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/team-manager@${{ steps.push.outputs.digest }}"

      # Publishes a second chart artifact under a sortable main-channel
      # snapshot version on every push to main -- same run_number-based
      # scheme and rationale as the images job's extra docker tag above.
      # Needed because chart.spec.version has no digest-pinning syntax the
      # way an image tag does, and source-controller only re-fetches a
      # HelmChart when spec.version itself resolves to a new value, not when
      # a fixed version tag's underlying content changes -- so a floating
      # alias like a plain "main" version wouldn't actually auto-update.
      - name: Package chart (main channel snapshot)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/helm-package-main
          helm package helm/team-manager \
            --version "0.0.0-main.${{ github.run_number }}" \
            --app-version "${{ steps.version.outputs.value }}" \
            --destination /tmp/helm-package-main

      - name: Push chart (main channel snapshot) to OCI registry
        if: github.ref == 'refs/heads/main'
        id: push-main
        run: |
          set -euo pipefail
          helm push "/tmp/helm-package-main/team-manager-0.0.0-main.${{ github.run_number }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts" 2>&1 | tee /tmp/helm-push-main.log
          digest=$(grep -oP 'Digest: \K\S+' /tmp/helm-push-main.log)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (main channel snapshot, keyless)
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/team-manager@${{ steps.push-main.outputs.digest }}"

    put:
      tags: [events]
      operationId: updateCalendarFeedSettings
      x-rbac-module: events
      x-rbac-self-service: true
      summary: >-
        Update the caller's calendar feed content selection for this team.
        Applies to the existing subscription URL -- no re-subscribing needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarFeedSettings"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarFeedSettings"

  /calendar-feed/{token}.ics:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [events]
      operationId: getCalendarFeed
      summary: >-
        Fetch a team's events as an iCalendar (.ics) feed. Unauthenticated by
        design: calendar apps poll this URL directly and cannot present a
        session cookie. The token itself is the credential -- see
        internal/calendarfeed for the authorization model.
      security: []
      responses:
        "200":
          description: >-
            iCalendar document. Content-Type is text/calendar, not
            application/json -- oapi-codegen models this as a raw-bytes
            response.
          content:
            text/calendar:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"


              schema:
                $ref: "#/components/schemas/StatsOverview"

  /teams/{teamId}/stats/attendance-matrix:
    parameters:
      - $ref: "#/components/parameters/teamId"
    get:
      tags: [stats]
      operationId: getAttendanceMatrix
      x-rbac-module: events
      summary: Per-member-per-event attendance matrix
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceMatrix"

  /teams/{teamId}/stats/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [stats]
      operationId: getMemberStats
      x-rbac-module: events
      summary: Individual member attendance statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAttendanceStats"

  /teams/{teamId}/stats/absences:
    parameters:
      - $ref: "#/components/parameters/teamId"
    get:
      tags: [stats]
      operationId: getStatsAbsences
      x-rbac-module: events
      summary: Per-member, per-event absence table for the date range
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceAbsenceTable"

# ─── Components ───────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    teamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    membershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    eventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    roleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    cursor:
      name: cursor
      in: query
      description: Opaque keyset-pagination cursor returned as nextCursor by a prior page.
      schema:
        type: string

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: >-
        Conflict. For example, an attendance change was rejected because the
        event's cancelled, or its cancelLeadMinutes cutoff has passed for a
        caller without write permission on events.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: >-
        Too Many Requests. Every endpoint is subject to the global per-IP
        rate limit (RATE_LIMIT_RPS); /auth/login additionally enforces a
        stricter per-IP limit (LOGIN_RATE_LIMIT_PER_MIN) for brute-force
        protection.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: >-
        Payload Too Large. All request bodies are capped at 4 MB by default;
        image upload endpoints additionally enforce their own lower limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PhotoRedirect:
      description: >-
        Redirect to a short-lived presigned URL for the image, hosted by the
        object store rather than this API. Access is membership-gated before
        the URL is issued; the URL itself carries no further authorization.
      headers:
        Location:
          schema:
            type: string
            format: uri
          description: Presigned URL to fetch the image bytes from.
    PhotoBytes:
      description: >-
        The image bytes, streamed directly by the backend instead of a
        redirect. Returned instead of the 302 when the deployment is
        configured for proxy image delivery (IMAGE_DELIVERY_PROXY_ENABLED=true);
        access is membership-gated before any bytes are streamed, same as
        the redirect mode's presign gating.
      content:
        image/*:
          schema:
            type: string
            format: binary

  schemas:

    # ── Primitives / Enums ────────────────────────────────────────────────────

    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    PermLevel:
      type: string
      enum: [none, read, write]

    Permissions:
      type: object
      description: Per-module permission levels
      required: [events, members, finances, news, polls, settings]
      properties:
        events:
          $ref: "#/components/schemas/PermLevel"
        members:
          $ref: "#/components/schemas/PermLevel"
        finances:
          $ref: "#/components/schemas/PermLevel"
        news:
          $ref: "#/components/schemas/PermLevel"
        polls:
          $ref: "#/components/schemas/PermLevel"
        settings:
          $ref: "#/components/schemas/PermLevel"

    EventType:
      type: string
      enum: [training, auftritt, event]

    EventStatus:
      type: string
      enum: [active, cancelled]

    AttendanceStatus:
      type: string
      enum: [yes, no, maybe, pending, not_nominated]

    ResponseMode:
      type: string
      enum: [opt_in, opt_out]

    TransactionType:
      type: string
      enum: [income, expense]

    ContributionStatus:
      type: string
      description: >-
        Derived from paidAmount vs. amount, never independently settable:
        "open" (paidAmount is 0), "partial" (0 < paidAmount < amount), or
        "paid" (paidAmount >= amount).
      enum: [open, partial, paid]

    NotificationType:
      type: string
      enum:
        - attendance
        - event_created
        - event_updated
        - event_cancelled
        - event_reactivated
        - event_deleted
        - news
        - poll
        - absence

    # ── Auth ─────────────────────────────────────────────────────────────────

    Provider:
      type: object
      required: [id, name, sub, glyph, bg, fg]
      properties:
        id:
          type: string
        name:
          type: string
        sub:
          type: string
        glyph:
          type: string
        bg:
          type: string
        fg:
          type: string
        border:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128

    RegisterResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string

    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128

    DeleteAccountRequest:
      type: object
      required: [confirmEmail]
      properties:
        confirmEmail:
          type: string
          format: email
          description: >
            The account's own email address, retyped to confirm the
            irreversible erasure. Must match the authenticated user's email.

    User:
      type: object
      required: [id, name, email, avatarColor]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        avatarColor:
          type: string
        birthday:
          type: string
          format: date
        address:
          type: string
        hasPhoto:
          type: boolean

    # ── Teams ────────────────────────────────────────────────────────────────

    Team:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        short:
          type: string
        icon:
          type: string
        iconBg:
          type: string
        iconFg:
          type: string
        description:
          type: string
        hasPhoto:
          type: boolean
        hasLogo:
          type: boolean
        reasonVisibilityRoleIds:
          type: array
          items:
            type: string
            format: uuid

    TeamForUser:
      allOf:
        - $ref: "#/components/schemas/Team"
        - type: object
          required: [myRoles, myPerms, membershipId, memberCount]
          properties:
            myRoles:
              type: array
              items:
                $ref: "#/components/schemas/Role"
            myPerms:
              $ref: "#/components/schemas/Permissions"
            membershipId:
              type: string
              format: uuid
            memberCount:
              type: integer

    AcceptInviteResponse:
      allOf:
        - $ref: "#/components/schemas/TeamForUser"
        - type: object
          required: [alreadyMember]
          properties:
            alreadyMember:
              type: boolean
              description: >-
                True when the caller was already a member of this team before
                redeeming the code (the request was a no-op join-wise).

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        icon:
          type: string
        iconBg:
          type: string
        iconFg:
          type: string

    UpdateTeamRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        short:
          type: string
          maxLength: 50
        icon:
          type: string
        iconBg:
          type: string
        iconFg:
          type: string
        description:
          type: string
          maxLength: 10000
        reasonVisibilityRoleIds:
          type: array
          items:
            type: string
            format: uuid

    Invite:
      type: object
      required: [id, teamId, code, link, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        code:
          type: string
        link:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    # ── Members & Roles ──────────────────────────────────────────────────────

    Role:
      type: object
      required: [id, teamId, name, system, permissions]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        name:
          type: string
        system:
          type: boolean
        color:
          type: string
        permissions:
          $ref: "#/components/schemas/Permissions"

    CreateRoleRequest:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
        color:
          type: string
          maxLength: 32
        permissions:
          $ref: "#/components/schemas/Permissions"

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
          maxLength: 32
        permissions:
          $ref: "#/components/schemas/Permissions"

    Member:
      type: object
      required: [membershipId, userId, name, email, avatarColor, roles, joinedAt]
      properties:
        membershipId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        birthday:
          type: string
          format: date
        address:
          type: string
        avatarColor:
          type: string
        hasPhoto:
          type: boolean
        group:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        primaryRole:
          $ref: "#/components/schemas/Role"
        perms:
          $ref: "#/components/schemas/Permissions"
        joinedAt:
          type: string
          format: date-time

    UpdateMemberRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        birthday:
          type: string
          format: date
        address:
          type: string
        roleIds:
          type: array
          items:
            type: string
            format: uuid
        group:
          type: string

    SetRolesRequest:
      type: object
      required: [roleIds]
      properties:
        roleIds:
          type: array
          items:
            type: string
            format: uuid

    # ── Events ───────────────────────────────────────────────────────────────

    EventSummary:
      type: object
      required: [yes, no, maybe, pending, notNominated, nominated, total]
      properties:
        yes:
          type: integer
        no:
          type: integer
        maybe:
          type: integer
        pending:
          type: integer
        notNominated:
          type: integer
        nominated:
          type: integer
        total:
          type: integer

    TeamEvent:
      type: object
      required:
        [id, teamId, type, title, date, status, recurring, summary, excludeFromStats]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/EventType"
        title:
          type: string
        date:
          type: string
          format: date
        multiDayEndDate:
          type: string
          format: date
          description: >-
            Optional last day of a multi-day span: when set, the event
            occurs on every calendar day from date through multiDayEndDate
            inclusive. Never set together with recurring: true.
        location:
          type: string
        note:
          type: string
        result:
          type: string
        meetTime:
          type: string
          description: "HH:mm"
        startTime:
          type: string
          description: "HH:mm"
        endTime:
          type: string
          description: "HH:mm"
        meetTimeMandatory:
          type: boolean
        responseMode:
          $ref: "#/components/schemas/ResponseMode"
        nominatedRoleIds:
          type: array
          items:
            type: string
            format: uuid
        recurring:
          type: boolean
        status:
          $ref: "#/components/schemas/EventStatus"
        summary:
          $ref: "#/components/schemas/EventSummary"
        myStatus:
          $ref: "#/components/schemas/AttendanceStatus"
        myAuto:
          type: boolean
        myReason:
          type: string
        cancelLeadMinutes:
          type: integer
          description: >-
            Optional cutoff, expressed as minutes before the event's start,
            after which a non-privileged member can no longer change their
            attendance response for this event.
        excludeFromStats:
          type: boolean
          description: >-
            When true, this event is left out of every attendance-statistics
            computation while remaining otherwise fully functional (RSVP,
            comments, notifications, cancellation are all unaffected).

    CreateEventRequest:
      type: object
      required: [type, title, date]
      properties:
        type:
          $ref: "#/components/schemas/EventType"
        title:
          type: string
          minLength: 1
          maxLength: 255
        date:
          type: string
          format: date
        multiDayEndDate:
          type: string
          format: date
          description: >-
            Optional last day of a multi-day span: when set, the event
            occurs on every calendar day from date through multiDayEndDate
            inclusive. Must not be earlier than date, and must not be set
            together with recurring: true.
        location:
          type: string
          maxLength: 255
        note:
          type: string
          maxLength: 10000
        meetTime:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        meetTimeMandatory:
          type: boolean
        responseMode:
          $ref: "#/components/schemas/ResponseMode"
        nominatedRoleIds:
          type: array
          items:
            type: string
            format: uuid
        recurring:
          type: boolean
        repeatWeeks:
          type: integer
          minimum: 1
          maximum: 104
        endDate:
          type: string
          format: date
          description: >-
            Alternative to repeatWeeks for a recurring series: generates
            weekly occurrences from date up to and including endDate instead
            of a fixed count. Mutually exclusive with repeatWeeks -- when
            both are set, endDate takes precedence.
        cancelLeadMinutes:
          type: integer
          minimum: 0
          description: >-
            Optional cutoff, expressed as minutes before the event's start,
            after which a non-privileged member can no longer change their
            attendance response. For a recurring series, seeds every
            generated occurrence's own cancelLeadMinutes, with each
            occurrence computing its own effective cutoff from its own
            start.
        excludeFromStats:
          type: boolean
          default: false
          description: >-
            When true, excludes this event from every attendance-statistics
            computation. For a recurring series, seeds every generated
            occurrence's own excludeFromStats.

    UpdateEventRequest:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/EventType"
        title:
          type: string
          minLength: 1
          maxLength: 255
        date:
          type: string
          format: date
        multiDayEndDate:
          type: string
          format: date
          description: >-
            Optional last day of a multi-day span: when set, the event
            occurs on every calendar day from date through multiDayEndDate
            inclusive. Must not be earlier than date, and must not be set
            together with recurring: true. Setting a new value always
            replaces the event's current span, if any -- to turn a
            multi-day event back into a single-day one, use
            clearMultiDayEndDate instead (mutually exclusive with this
            field, since a date field itself cannot carry both a value and
            an explicit "clear" signal).
        clearMultiDayEndDate:
          type: boolean
          description: >-
            When true, clears the event's multiDayEndDate back to unset
            (single-day). Mutually exclusive with multiDayEndDate.
        location:
          type: string
          maxLength: 255
        note:
          type: string
          maxLength: 10000
        meetTime:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        meetTimeMandatory:
          type: boolean
        responseMode:
          $ref: "#/components/schemas/ResponseMode"
        nominatedRoleIds:
          type: array
          items:
            type: string
            format: uuid
        cancelLeadMinutes:
          type: integer
          minimum: 0
          description: >-
            Optional cutoff, expressed as minutes before the event's start,
            after which a non-privileged member can no longer change their
            attendance response.
        excludeFromStats:
          type: boolean
          description: >-
            When true, excludes this event from every attendance-statistics
            computation. With scope=series, applies to every occurrence of
            the series; with scope=single, applies only to the targeted
            occurrence.

    SetEventStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/EventStatus"

    EventComment:
      type: object
      required: [id, eventId, userId, text, createdAt]
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        text:
          type: string
        createdAt:
          type: string
          format: date-time
        authorName:
          type: string
        authorColor:
          type: string
        hasAuthorPhoto:
          type: boolean
        authorMembershipId:
          type: string
          format: uuid

    AddCommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1

    # ── Attendance ───────────────────────────────────────────────────────────

    AttendanceRecord:
      type: object
      required: [id, eventId, userId, status]
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        reason:
          type: string
        reasonId:
          type: string
        reasonVisibility:
          type: string
          enum: [trainers, team]
        at:
          type: string
          format: date-time

    AttendanceRow:
      type: object
      required: [userId, name, avatarColor, status]
      properties:
        userId:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        name:
          type: string
        avatarColor:
          type: string
        hasPhoto:
          type: boolean
        group:
          type: string
        primaryRole:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        reason:
          type: string
        reasonId:
          type: string
        reasonVisibility:
          type: string
          enum: [trainers, team]
        auto:
          type: boolean
        absent:
          type: boolean

    SetAttendanceRequest:
      type: object
      required: [userId, status]
      properties:
        userId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        reason:
          type: string
          maxLength: 500
        reasonId:
          type: string
        reasonVisibility:
          type: string
          enum: [trainers, team]

    SetNominationRequest:
      type: object
      required: [userId, nominated]
      properties:
        userId:
          type: string
          format: uuid
        nominated:
          type: boolean

    # ── Absences ─────────────────────────────────────────────────────────────

    Absence:
      type: object
      required: [id, userId, from, to, createdAt, notRelevantForStats]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
        memberName:
          type: string
        memberAvatarColor:
          type: string
        hasPhoto:
          type: boolean
        memberMembershipId:
          type: string
          format: uuid
        roleColor:
          type: string
        roleName:
          type: string
        notRelevantForStats:
          type: boolean
          description: >-
            When true, the event dates this absence covers are excluded
            entirely from this member's attendance statistics (neither
            counted as attending nor as absent), instead of counting as
            absent like a normal absence.

    SetAbsenceStatsRelevanceRequest:
      type: object
      required: [notRelevantForStats]
      properties:
        notRelevantForStats:
          type: boolean

    CreateAbsenceRequest:
      type: object
      required: [userId, from, to]
      properties:
        userId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        reason:
          type: string

    UpdateAbsenceRequest:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        reason:
          type: string

    # ── News ─────────────────────────────────────────────────────────────────

    NewsItem:
      type: object
      required: [id, teamId, authorId, title, body, pinned, createdAt]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        pinned:
          type: boolean
        createdAt:
          type: string
          format: date-time
        authorName:
          type: string
        authorColor:
          type: string
        hasAuthorPhoto:
          type: boolean

    CreateNewsRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
          minLength: 1
          maxLength: 10000
        pinned:
          type: boolean
          default: false

    UpdateNewsRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
          minLength: 1
          maxLength: 10000
        pinned:
          type: boolean

    # ── Polls ────────────────────────────────────────────────────────────────

    PollOption:
      type: object
      required: [id, text, count, pct]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        count:
          type: integer
        pct:
          type: number
          format: float
        voters:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
                format: uuid
                description: >-
                  Voter's stable user id. Present only for non-anonymous polls;
                  omitted entirely for anonymous polls, which expose no identities.
              membershipId:
                type: string
                format: uuid
                description: >-
                  Voter's membership id in the poll's team, used to build the
                  member photo URL. Present only for non-anonymous polls.
              name:
                type: string
              color:
                type: string
              hasPhoto:
                type: boolean

    Poll:
      type: object
      required: [id, question, multiple, anonymous, createdAt, totalVotes, options]
      properties:
        id:
          type: string
          format: uuid
        question:
          type: string
        multiple:
          type: boolean
        anonymous:
          type: boolean
        createdAt:
          type: string
          format: date-time
        totalVotes:
          type: integer
        myVote:
          type: array
          items:
            type: string
            format: uuid
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOption"

    CreatePollRequest:
      type: object
      required: [question, options]
      properties:
        question:
          type: string
        options:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 4
        multiple:
          type: boolean
          default: false
        anonymous:
          type: boolean
          default: false

    VotePollRequest:
      type: object
      required: [optionIds]
      properties:
        optionIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 0
          maxItems: 4
          description: >-
            Empty array clears the caller's vote. Voting UIs let a user
            un-select their last remaining choice on a multi-select poll,
            which submits an empty array to retract the vote entirely.
            Capped to match CreatePollRequest.options' maxItems, since a
            poll can never have more options than that to vote for.

    # ── Notifications ────────────────────────────────────────────────────────

    AppNotification:
      type: object
      required: [id, teamId, type, createdAt]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        actorId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        title:
          type: string
        eventId:
          type: string
          format: uuid
        eventTitle:
          type: string
        eventDate:
          type: string
          format: date
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        actorName:
          type: string
        actorColor:
          type: string
        hasActorPhoto:
          type: boolean
        actorMembershipId:
          type: string
          format: uuid
        unread:
          type: boolean

    NotificationsResult:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AppNotification"
        unreadCount:
          type: integer

    # ── Push notifications ────────────────────────────────────────────────────

    PushSubscriptionRequest:
      type: object
      required: [endpoint, keys]
      description: >-
        Mirrors the shape PushSubscription.toJSON() produces in the browser.
      properties:
        endpoint:
          type: string
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string

    PushCategoryPreferences:
      type: object
      description: >-
        Per-team Web Push opt-out, one boolean per notification category.
        A category set to false suppresses push delivery for that category
        in this team only; the in-app notification feed is unaffected.
        Also carries the member's event-reminder push settings for this
        team -- a separate, time-triggered push (not tied to any
        notification category) sent shortly before an upcoming event
        starts.
      required:
        [attendance, events, news, polls, absence, eventReminderEnabled, eventReminderHoursBefore]
      properties:
        attendance:
          type: boolean
        events:
          type: boolean
        news:
          type: boolean
        polls:
          type: boolean
        absence:
          type: boolean
        eventReminderEnabled:
          type: boolean
          description: Whether a push reminder is sent before upcoming events in this team.
        eventReminderHoursBefore:
          type: integer
          minimum: 1
          maximum: 72
          description: How many hours before an event's start the reminder push is sent.

    # ── Calendar feed ──────────────────────────────────────────────────────────

    CalendarFeedToken:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Ready-to-use calendar subscription URL (https://...).

    CalendarFeedSettings:
      type: object
      required: [types, includeBirthdays]
      properties:
        types:
          type: array
          description: >-
            Event types the feed includes. An empty array means the feed
            carries no events (birthdays only, if includeBirthdays is true).
          items:
            $ref: "#/components/schemas/EventType"
        includeBirthdays:
          type: boolean
          description: Whether the feed includes visible members' birthdays.

    # ── Calendar shares ──────────────────────────────────────────────────────

    CalendarShare:
      type: object
      description: A grant of read-only calendar visibility from the owning team to another team.
      required: [viewerTeamId, viewerTeamName, createdAt]
      properties:
        viewerTeamId:
          type: string
          format: uuid
        viewerTeamName:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateCalendarShareRequest:
      type: object
      required: [viewerTeamId]
      properties:
        viewerTeamId:
          type: string
          format: uuid

    SharedCalendarSource:
      type: object
      description: A team that has granted the requesting team read-only calendar visibility.
      required: [ownerTeamId, ownerTeamName]
      properties:
        ownerTeamId:
          type: string
          format: uuid
        ownerTeamName:
          type: string

    SharedCalendarEvent:
      type: object
      description: >-
        A redacted projection of an event for cross-team calendar sharing --
        deliberately excludes attendance, participants, comments, and notes.
      required: [id, type, title, date]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/EventType"
        title:
          type: string
        date:
          type: string
          format: date
        multiDayEndDate:
          type: string
          format: date
          description: >-
            Optional last day of a multi-day span (see TeamEvent's field of
            the same name); when set, the event occurs on every calendar
            day from date through multiDayEndDate inclusive.
        startTime:
          type: string
          description: "HH:mm"
        endTime:
          type: string
          description: "HH:mm"
        location:
          type: string

    # ── Finances ─────────────────────────────────────────────────────────────

    Transaction:
      type: object
      required: [id, teamId, type, title, amount, date]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/TransactionType"
        title:
          type: string
        amount:
          type: integer
          format: int64
          description: Amount in cents (e.g. 1050 = 10.50)
        date:
          type: string
          format: date
        category:
          type: string
        contributionId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The membership fee this transaction (fully or partially) pays,
            or null if it isn't a fee payment. Set at creation time only --
            see CreateTransactionRequest.contributionId.
        penaltyAssignmentId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The penalty assignment this transaction pays, or null if it
            isn't a fine payment. Mutually exclusive with contributionId.
            Set at creation time only -- see
            CreateTransactionRequest.penaltyAssignmentId.
        note:
          type: string
          nullable: true
          description: >-
            Optional free-text note about the transaction. Never shown in
            the transaction list -- only when the transaction is opened for
            editing.

    CreateTransactionRequest:
      type: object
      required: [type, title, amount]
      properties:
        type:
          $ref: "#/components/schemas/TransactionType"
        title:
          type: string
          maxLength: 255
        amount:
          type: integer
          format: int64
          description: Amount in cents (e.g. 1050 = 10.50)
          minimum: 1
          maximum: 100000000
        category:
          type: string
          maxLength: 255
        date:
          type: string
          format: date
          description: >-
            Transaction date (e.g. to back-date a receipt). Defaults to the
            server's current date when omitted.
        contributionId:
          type: string
          format: uuid
          description: >-
            Links this transaction to a membership fee it (fully or
            partially) pays -- the fee's paidAmount becomes the sum of every
            income transaction linked to it this way. Only valid when
            `type` is `income`; rejected otherwise. Mutually exclusive with
            penaltyAssignmentId.
        penaltyAssignmentId:
          type: string
          format: uuid
          description: >-
            Links this transaction to a penalty assignment (fine) it pays --
            the assignment's paidAmount becomes the sum of every income
            transaction linked to it this way, and paid becomes true once
            that sum reaches the assignment's amount. Only valid when `type`
            is `income`; rejected otherwise. Mutually exclusive with
            contributionId.
        note:
          type: string
          maxLength: 10000
          description: >-
            Optional free-text note. Never shown in the transaction list --
            only when the transaction is opened for editing.

    UpdateTransactionRequest:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/TransactionType"
        title:
          type: string
          maxLength: 255
        amount:
          type: integer
          format: int64
          description: Amount in cents (e.g. 1050 = 10.50)
          minimum: 1
          maximum: 100000000
        category:
          type: string
          maxLength: 255
        date:
          type: string
          format: date
          description: Transaction date.
        note:
          type: string
          maxLength: 10000

    Penalty:
      type: object
      required: [id, teamId, label, amount]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        label:
          type: string
        amount:
          type: integer
          format: int64
          description: Amount in cents (e.g. 1050 = 10.50)

    CreatePenaltyRequest:
      type: object
      required: [label, amount]
      properties:
        label:
          type: string
        amount:
          type: integer
          format: int64
          description: Amount in cents (e.g. 1050 = 10.50)
          minimum: 1
          maximum: 100000000

    UpdatePenaltyRequest:
      type: object
      properties:
        label:
          type: string
        amount:
          type: integer
          format: int64
          description: Amount in cents (e.g. 1050 = 10.50)
          minimum: 1
          maximum: 100000000

    PenaltyAssignment:
      type: object
      required: [id, teamId, userId, paid, paidAmount, date]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        penaltyId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The catalog penalty this assignment was created from, or null if
            that penalty has since been deleted. The assignment's own label and
            amount snapshot (taken at creation) remain the authoritative record.
        paid:
          type: boolean
          description: >-
            Derived from paidAmount vs. amount (paidAmount >= amount), never
            independently settable -- see Transaction.penaltyAssignmentId.
        paidAmount:
          type: integer
          format: int64
          description: >-
            Sum of every income transaction linked to this assignment
            (Transaction.penaltyAssignmentId), in cents. Computed, not stored.
        date:
          type: string
          format: date
        memberName:
          type: string
        memberAvatarColor:
          type: string
        hasPhoto:
          type: boolean
        label:
          type: string
        amount:
          type: integer
          format: int64
          description: Amount in cents (e.g. 1050 = 10.50)
        note:
          type: string
          maxLength: 10000

    CreatePenaltyAssignmentRequest:
      type: object
      required: [userId, penaltyId]
      properties:
        userId:
          type: string
          format: uuid
        penaltyId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: >-
            The date the penalty was earned (e.g. to back-date an assignment
            recorded after the fact). Defaults to the server's current date
            when omitted.
        note:
          type: string
          maxLength: 10000
          description: Optional free-text note explaining the assignment.

    OpenPenalty:
      type: object
      required: [userId, name, avatarColor, amount]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        avatarColor:
          type: string
        hasPhoto:
          type: boolean
        amount:
          type: integer
          format: int64
          description: Amount in cents (e.g. 1050 = 10.50)

    Contribution:
      type: object
      required: [id, teamId, userId, name, amount, paidAmount, status, archived]
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
          description: Free-text fee name (e.g. "Mitgliedsbeitrag Januar 2026").
        description:
          type: string
          nullable: true
          description: Optional free-text description beyond the short name.
        amount:
          type: integer
          format: int64
          description: Amount in cents (e.g. 1050 = 10.50)
        dueDate:
          type: string
          format: date
          nullable: true
        paidAmount:
          type: integer
          format: int64
          description: >-
            Sum of every income transaction linked to this contribution
            (Transaction.contributionId), in cents. Computed, not stored.
            May exceed `amount` when overpaid -- not capped.
        status:
          $ref: "#/components/schemas/ContributionStatus"
        archived:
          type: boolean
          description: >-
            When true, this contribution is excluded from the default
            display, the contribution matrix, the linking picker, and the
            contribOpen aggregate. Never affects linked transactions.
        memberName:
          type: string
        memberAvatarColor:
          type: string
        hasPhoto:
          type: boolean

    CreateContributionRequest:
      type: object
      required: [name, amount, userIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        amount:
          type: integer
          format: int64
          description: Amount in cents (e.g. 1050 = 10.50)
          minimum: 1
          maximum: 100000000
        dueDate:
          type: string
          format: date
        userIds:
          type: array
          description: >-
            The members this fee applies to; one Contribution row is created
            per id, all sharing this name/amount/dueDate/description.
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 200

    UpdateContributionRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        amount:
          type: integer
          format: int64
          description: Amount in cents (e.g. 1050 = 10.50)
          minimum: 1
          maximum: 100000000
        dueDate:
          type: string
          format: date
        archived:
          type: boolean

    FinanceOverview:
      type: object
      required: [balance, income, expense, transactions, penalties, assignments, openPenalties, openPenaltySum, contributions, contribOpen]
      properties:
        balance:
          type: integer
          format: int64
          description: Balance in cents (income minus expense)
        income:
          type: integer
          format: int64
          description: Total income in cents
        expense:
          type: integer
          format: int64
          description: Total expense in cents
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        penalties:
          type: array
          items:
            $ref: "#/components/schemas/Penalty"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/PenaltyAssignment"
        openPenalties:
          type: array
          items:
            $ref: "#/components/schemas/OpenPenalty"
        openPenaltySum:
          type: integer
          format: int64
          description: Sum of all open (unpaid) penalties across all members, in cents
        contributions:
          type: array
          items:
            $ref: "#/components/schemas/Contribution"
        contribOpen:
          type: integer
          description: >-
            Count of contributions not yet fully paid (status "open" or
            "partial").

    # ── Stats ────────────────────────────────────────────────────────────────

    MemberAttendanceStats:
      type: object
      required: [quote, counted, yes]
      properties:
        quote:
          type: number
          format: float
        counted:
          type: integer
        yes:
          type: integer

    MemberStat:
      type: object
      required: [userId, name, avatarColor, quote, counted, yes]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        avatarColor:
          type: string
        hasPhoto:
          type: boolean
        quote:
          type: number
          format: float
        counted:
          type: integer
        yes:
          type: integer

    EventStat:
      type: object
      required: [id, title, type, date, yes, nominated, pct, enough]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        type:
          $ref: "#/components/schemas/EventType"
        date:
          type: string
          format: date
        yes:
          type: integer
        nominated:
          type: integer
        pct:
          type: number
          format: float
        enough:
          type: boolean

    StatsOverview:
      type: object
      required: [avg, members, events, pastCount, from, to]
      properties:
        avg:
          type: number
          format: float
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberStat"
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventStat"
        pastCount:
          type: integer
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    AttendanceMatrixColumn:
      type: object
      required: [id, title, type, date]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        type:
          $ref: "#/components/schemas/EventType"
        date:
          type: string
          format: date

    AttendanceMatrixRow:
      type: object
      required: [userId, name, avatarColor, yes, counted, cells]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        avatarColor:
          type: string
        hasPhoto:
          type: boolean
        yes:
          type: integer
        counted:
          type: integer
        cells:
          type: object
          description: >-
            Effective attendance status keyed by event id; missing key ⇒ pending.
            Only yes/no/maybe/pending are emitted (not_nominated folds to pending).
          additionalProperties:
            $ref: "#/components/schemas/AttendanceStatus"

    AttendanceMatrix:
      type: object
      required: [from, to, events, members]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        events:
          type: array
          description: Columns, ordered by date ascending.
          items:
            $ref: "#/components/schemas/AttendanceMatrixColumn"
        members:
          type: array
          description: Rows, ordered by attendance (most yes first), then name.
          items:
            $ref: "#/components/schemas/AttendanceMatrixRow"

    AttendanceAbsenceRow:
      type: object
      required: [userId, memberName, eventId, eventTitle, eventDate]
      properties:
        userId:
          type: string
          format: uuid
        memberName:
          type: string
        eventId:
          type: string
          format: uuid
        eventTitle:
          type: string
        eventDate:
          type: string
          format: date

    AttendanceAbsenceTable:
      type: object
      required: [rows, from, to]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceAbsenceRow"
        from:
          type: string
          format: date
        to:
          type: string
          format: date

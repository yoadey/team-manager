openapi: "3.0.3"

info:
  title: Team Manager API
  description: >-
    REST API for the Teamverwaltung sports-club management application.


    Every endpoint may return `429 Too Many Requests` (global per-IP rate
    limit, `RATE_LIMIT_RPS`) or `413 Payload Too Large` (request body cap,
    4 MB by default) — see the `TooManyRequests`/`PayloadTooLarge` reusable
    responses. These aren't repeated on every operation below to keep the
    spec readable; `/auth/login`, `/auth/register` and
    `/auth/resend-verification` document their own stricter per-IP rate
    limits explicitly since they differ from the global default
    (`LOGIN_RATE_LIMIT_PER_MIN`, `REGISTER_RATE_LIMIT_PER_MIN`,
    `RESEND_VERIFICATION_RATE_LIMIT_PER_MIN`,
    `FORGOT_PASSWORD_RATE_LIMIT_PER_MIN`).
  # This field is required by the OpenAPI 3.0 schema but is NOT the API's
  # real versioning/deprecation signal -- it's never bumped per release and
  # doesn't track anything. The actual mechanism is the `API-Version`
  # response header (see main.go) plus the `Deprecation`/`Sunset` headers
  # driven by API_DEPRECATION_DATE (see CLAUDE.md's env-var table).
  version: "1.0.0"
  contact:
    name: Team Manager
    url: https://github.com/yoadey/team-manager

servers:
  - url: /api/v1
    description: Current server

security:
  - bearerAuth: []

# ─── Tags ────────────────────────────────────────────────────────────────────
tags:
  - name: auth
  - name: teams
  - name: members
  - name: roles
  - name: events
  - name: attendance
  - name: absences
  - name: news
  - name: polls
  - name: notifications
  - name: push
  - name: finances
  - name: stats

# ─── Paths ───────────────────────────────────────────────────────────────────
paths:

  # ── Auth ────────────────────────────────────────────────────────────────────

  /auth/providers:
    get:
      tags: [auth]
      operationId: listProviders
      summary: List available login providers
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate with email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Self-register a new account with email + password
      description: >
        Creates an unverified account and emails a verification link. The
        response is always the same generic message regardless of whether the
        email was available, already registered and verified, or already
        registered and still pending verification — this endpoint never
        reveals account existence. Disabled server-side via
        `SELF_REGISTRATION_ENABLED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: >-
            Registration accepted. If the email can be registered, a
            verification link has been sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Consume an email verification token and establish a session
      description: >
        Marks the account verified and returns a session, identical in shape
        to `login`'s response, so the client can reuse its normal
        post-login bootstrap.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Resend the email verification link
      description: >
        Always returns the same generic response regardless of whether the
        email has no account, an already-verified account, or a still-
        unverified account — only the last case actually sends a new email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "202":
          description: >-
            If a still-unverified account exists for this email, a new
            verification link has been sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request a password-reset link
      description: >
        Emails a password-reset link if (and only if) a password-based
        account exists for the submitted email. The response is always the
        same generic message regardless of whether the email has no
        account, an account with no password set (OIDC-only), or a
        password account — this endpoint never reveals account existence
        or auth method.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: >-
            If a password-based account exists for this email, a
            password-reset link has been sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Consume a password reset token and set a new password
      description: >
        Sets the account's new password, invalidates every existing session
        for that account, and returns a session identical in shape to
        `login`'s response so the client can reuse its normal post-login
        bootstrap on the device that performed the reset.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Invalidate current session
      responses:
        "204":
          description: No Content

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Get authenticated user profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [auth]
      operationId: deleteCurrentUser
      summary: Erase the authenticated account (GDPR Art. 17, by anonymization)
      description: >
        Anonymizes the user's personal data (name, email, phone, birthday,
        address, photo) and strips free-text PII from their comments and
        absence reasons, then deletes all of their sessions. Membership,
        attendance and finance records are retained in anonymized form so that
        shared and legally required data (e.g. accounting) stays intact. The
        request is authorized by the active session; to confirm intent the
        caller must echo the account's own email address (works regardless of
        login method, including OIDC accounts that have no password).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: Account anonymized; session cleared
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me/data-export:
    get:
      tags: [auth]
      operationId: getMyDataExport
      summary: Export the authenticated user's personal data (GDPR Art. 15)
      description: >
        Returns a single JSON document with all personal data held about the
        authenticated user: profile, memberships and roles, attendance,
        comments, absences, authored news, created polls, votes, penalty
        assignments and contributions.
      responses:
        "200":
          description: Personal-data export document.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Suggests a download filename.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me/photo:
    get:
      tags: [auth]
      operationId: getMyPhoto
      summary: Get user profile photo
      responses:
        "200":
          $ref: "#/components/responses/PhotoBytes"
        "302":
          $ref: "#/components/responses/PhotoRedirect"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [auth]
      operationId: uploadMyPhoto
      summary: Upload / replace profile photo (scaled to max 800×800 px)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  # ── Push notifications ───────────────────────────────────────────────────────
  # User-scoped (no {teamId}), like /auth/me/photo above -- a subscription
  # covers push delivery for every team the user belongs to, so it needs no
  # x-rbac-module: genrbac only requires that extension on team-scoped
  # ({teamId}-bearing) operations; membership in the authenticated session is
  # already sufficient here, same as /auth/me/photo.

  /users/me/push-subscriptions:
    post:
      tags: [push]
      operationId: registerPushSubscription
      summary: Register (or update) this browser's Web Push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionRequest"
      responses:
        "204":
          description: No Content
    delete:
      tags: [push]
      operationId: deletePushSubscription
      summary: Unregister a Web Push subscription
      parameters:
        - name: endpoint
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content

  # Team-scoped: which notification categories get pushed for this team,
  # independent of any other team the caller belongs to. x-rbac-module:
  # public -- a member manages only their own preferences within a team they
  # already belong to, same gate as /teams/{teamId}/notifications.
  /teams/{teamId}/push-preferences:
    parameters:
      - $ref: "#/components/parameters/teamId"
    get:
      tags: [push]
      operationId: getPushPreferences
      x-rbac-module: public
      summary: Get the caller's per-category Web Push preferences for this team
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushCategoryPreferences"
    put:
      tags: [push]
      operationId: setPushPreferences
      x-rbac-module: public
      summary: Set the caller's per-category Web Push preferences for this team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushCategoryPreferences"
      responses:
        "204":
          description: No Content

  # ── Teams ───────────────────────────────────────────────────────────────────

  /teams:
    get:
      tags: [teams]
      operationId: listTeams
      summary: List teams the authenticated user belongs to
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamForUser"
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a new team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamForUser"

  /teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/teamId"
    get:
      tags: [teams]
      operationId: getTeam
      x-rbac-module: public
      summary: Get a single team
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [teams]
      operationId: updateTeam
      x-rbac-module: settings
      summary: Update team settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{teamId}/photo:
    parameters:
      - $ref: "#/components/parameters/teamId"
    get:
      tags: [teams]
      operationId: getTeamPhoto
      x-rbac-module: public
      summary: Get team photo
      responses:
        "200":
          $ref: "#/components/responses/PhotoBytes"
        "302":
          $ref: "#/components/responses/PhotoRedirect"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [teams]
      operationId: uploadTeamPhoto
      x-rbac-module: settings
      summary: Upload team photo (scaled to max 800×800 px)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      tags: [teams]
      operationId: deleteTeamPhoto
      x-rbac-module: settings
      summary: Remove team photo (revert to icon)
      responses:
        "204":
          description: No Content

  /teams/{teamId}/logo:
    parameters:
      - $ref: "#/components/parameters/teamId"
    get:
      tags: [teams]
      operationId: getTeamLogo
      x-rbac-module: public
      summary: Get team logo
      responses:
        "200":
          $ref: "#/components/responses/PhotoBytes"
        "302":
          $ref: "#/components/responses/PhotoRedirect"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [teams]
      operationId: uploadTeamLogo
      x-rbac-module: settings
      summary: Upload team logo (scaled to max 800×800 px)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      tags: [teams]
      operationId: deleteTeamLogo
      x-rbac-module: settings
      summary: Remove team logo (revert to icon)
      responses:
        "204":
          description: No Content

  /teams/{teamId}/invite:
    parameters:
      - $ref: "#/components/parameters/teamId"
    post:
      tags: [teams]
      operationId: createInvite
      x-rbac-module: settings
      summary: Generate a 7-day invite link
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"

  /invites/{code}/accept:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [teams]
      operationId: acceptInvite
      summary: Redeem an invite code, adding the authenticated user to its team
      description: >-
        Idempotent: redeeming a code for a team the caller already belongs to
        just returns that team rather than erroring.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInviteResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Members ─────────────────────────────────────────────────────────────────

  /teams/{teamId}/members:
    parameters:
      - $ref: "#/components/parameters/teamId"
    get:
      tags: [members]
      operationId: listMembers
      x-rbac-module: members
      summary: List team members
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
                  nextCursor:
                    type: string
                    nullable: true
                    description: Cursor for the next page, or null when there are no more items.

  /teams/{teamId}/members/{membershipId}:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/membershipId"
    patch:
      tags: [members]
      operationId: updateMember
      x-rbac-module: members
      summary: Update member profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      tags: [members]
      operationId: removeMember
      x-rbac-module: members
      summary: Remove member from team
      responses:
        "204":
          description: No Content

  /teams/{teamId}/members/{membershipId}/photo:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/membershipId"
    get:
      tags: [members]
      operationId: getMemberPhoto
      x-rbac-module: members
      summary: Get a team member's profile photo
      responses:
        "200":
          $ref: "#/components/responses/PhotoBytes"
        "302":
          $ref: "#/components/responses/PhotoRedirect"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{teamId}/members/{membershipId}/roles:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/membershipId"
    put:
      tags: [members]
      operationId: setMemberRoles
      x-rbac-module: settings
      summary: Replace member role assignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRolesRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  # ── Roles ───────────────────────────────────────────────────────────────────

  /teams/{teamId}/roles:
    parameters:
      - $ref: "#/components/parameters/teamId"
    get:
      tags: [roles]
      operationId: listRoles
      x-rbac-module: settings
      summary: List team roles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      tags: [roles]
      operationId: createRole
      x-rbac-module: settings
      summary: Create a custom role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

  /teams/{teamId}/roles/{roleId}:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/roleId"
    patch:
      tags: [roles]
      operationId: updateRole
      x-rbac-module: settings
      summary: Update role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    delete:
      tags: [roles]
      operationId: deleteRole
      x-rbac-module: settings
      summary: Delete role
      responses:
        "204":
          description: No Content

  # ── Calendar shares (owner-team management) ─────────────────────────────────

  /teams/{teamId}/calendar-shares:
    parameters:
      - $ref: "#/components/parameters/teamId"
    get:
      tags: [teams]
      operationId: listCalendarShares
      x-rbac-module: settings
      summary: List teams this team has granted read-only calendar visibility to
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarShare"
    post:
      tags: [teams]
      operationId: createCalendarShare
      x-rbac-module: settings
      summary: Grant another team read-only visibility of this team's calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalendarShareRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarShare"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{teamId}/calendar-shares/{viewerTeamId}:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - name: viewerTeamId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [teams]
      operationId: deleteCalendarShare
      x-rbac-module: settings
      summary: Revoke a previously granted calendar share
      responses:
        "204":
          description: No Content

  # ── Events ──────────────────────────────────────────────────────────────────

  /teams/{teamId}/events:
    parameters:
      - $ref: "#/components/parameters/teamId"
    get:
      tags: [events]
      operationId: listEvents
      x-rbac-module: events
      summary: List events
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [upcoming, past, all]
            default: upcoming
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamEvent"
                  nextCursor:
                    type: string
                    nullable: true
                    description: Cursor for the next page, or null when there are no more items.
    post:
      tags: [events]
      operationId: createEvent
      x-rbac-module: events
      summary: Create event (recurring → creates series + instances)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamEvent"

  /teams/{teamId}/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/eventId"
    get:
      tags: [events]
      operationId: getEvent
      x-rbac-module: events
      summary: Get single event with attendance summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamEvent"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [events]
      operationId: updateEvent
      x-rbac-module: events
      summary: Update event
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [single, series]
            default: single
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: OK
          content:
